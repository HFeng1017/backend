server:
  port: 9090

spring:
  application:
    name: resume-platform

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/resume_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: lostfound
    password: hlf1017

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000
      # 可选：Redis 密码
      # password: your-redis-password

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.resume.platform.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

file:
  upload-dir: uploads

jwt:
  secret: resume-platform-secret-key-2024-jwt-token-generation-for-secure-authentication-with-hs512-algorithm
  access-token-expire: 3600000
  refresh-token-expire: 604800000
