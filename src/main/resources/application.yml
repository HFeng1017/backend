server:
  port: 9090
  servlet:
    # SSE异步请求超时（5分钟）
    async:
      request-timeout: 300s
  tomcat:
    # SSE长连接支持：禁用连接超时
    connection-timeout: -1
    # 最大线程数，支持SSE长连接（每个连接占用一个线程）
    threads:
      max: 200
    # keep-alive超时
    max-keep-alive-requests: 1000

spring:
  application:
    name: resume-platform

  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/resume_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username:
    password:

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      # 连接超时（毫秒）
      timeout: 3000
      # Lettuce客户端配置
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          # 连接池获取连接超时（毫秒）
          max-wait: 3000
      # 可选：Redis 密码
      # password: your-redis-password

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.resume.platform.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

file:
  upload-dir: uploads

jwt:
  secret: resume-platform-secret-key-2024-jwt-token-generation-for-secure-authentication-with-hs512-algorithm
  access-token-expire: 3600000
  refresh-token-expire: 604800000

# 智谱AI配置
ai:
  zhipu:
    # API密钥（格式：id.secret）
    api-key:
    # 智谱AI v4接口地址
    base-url: https://open.bigmodel.cn
    # 默认模型
    model: glm-4
    # 生成温度（0-1，值越大随机性越强）
    temperature: 0.7
    # 最大输出Token数
    max-tokens: 2048
    # WebClient连接超时（毫秒）
    connect-timeout: 10000
    # WebClient响应超时（毫秒）
    response-timeout: 60000
  # 会话管理配置
  session:
    # 滑动窗口最大消息条数（超出截断最早消息）
    max-history: 20
    # 会话过期时间（分钟）
    ttl-minutes: 30
    # 系统提示词
    system-prompt: 你是简历平台的AI助手，可以帮用户优化简历、解答求职问题、提供职业建议。请用简洁专业的中文回答。
